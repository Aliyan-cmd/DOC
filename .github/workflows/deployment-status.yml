name: Backend Health Monitor

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *' # Check every 30 minutes

jobs:
  health-check:
    runs-on: ubuntu-latest
    env:
      BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL || 'https://haven-backend.onrender.com/health' }}
    steps:
      - name: Wait for Deployment
        if: github.event_name == 'push'
        run: |
          echo "⏱️  Waiting 2 minutes for Render auto-deploy to start..."
          sleep 120
      
      - name: Check Backend Health
        run: |
          echo "🔍 Checking backend health at $BACKEND_HEALTH_URL"
          
          MAX_ATTEMPTS=5
          ATTEMPT=0
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            if ! STATUS_CODE=$(curl --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              --output /dev/null --write-out "%{http_code}" \
              "$BACKEND_HEALTH_URL"); then
              STATUS_CODE="000"
            fi
            
            if [ "$STATUS_CODE" = "200" ]; then
              echo "✅ Backend is healthy!"
              exit 0
            fi
            
            echo "⏳ Attempt $((ATTEMPT+1))/$MAX_ATTEMPTS: Status $STATUS_CODE"
            sleep 15
            ATTEMPT=$((ATTEMPT+1))
          done
          
          echo "❌ Backend health check failed"
          exit 1
      
      - name: Success Notification
        if: success()
        run: echo "::notice::Backend is healthy at $BACKEND_HEALTH_URL"
      
      - name: Failure Notification
        if: failure()
        run: echo "::error::Backend health check failed - check Render dashboard"
